name: Deploy Frontend to Production

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      # Copy build to temporary folder first
      - name: Copy Build to Temp Folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/srv/launchpad-frontend-temp/"

      # Replace production safely
      - name: Replace Production Files
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            rm -rf /srv/launchpad-frontend/*
            mv /srv/launchpad-frontend-temp/* /srv/launchpad-frontend/
            rm -rf /srv/launchpad-frontend-temp
            chown -R www-data:www-data /srv/launchpad-frontend
            chmod -R 755 /srv/launchpad-frontend
            sudo systemctl reload nginx